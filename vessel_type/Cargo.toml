[package]
name = "vessel_type"
version.workspace = true
edition.workspace = true

[dependencies]
strum = { version = "0.28", features = ["derive"] }
pyo3 = { version = "0.30", optional = true }

[build-dependencies]
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[features]
pyo3 = ["dep:pyo3"]
