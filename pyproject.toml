[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "autowsgr_native"
dynamic = ["version"]
description = "Image recognition library for AutoWSGR"
requires-python = ">=3.12"
dependencies = ["numpy>=1.24.4", "opencv-python>=4.13.0.92"]

[tool.maturin]
features = ["pyo3/extension-module"]
# Default cargo manifest used by maturin when run from the repository root
manifest-path = "python_bindings/Cargo.toml"
